name: Build GodMace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        shell: bash
        run: |
          pom_path="$(find . -name pom.xml -not -path '*/target/*' -print -quit)"
          if [ -z "$pom_path" ]; then
            echo "Could not find pom.xml in the checked-out repository." >&2
            exit 1
          fi
          mvn --batch-mode -f "$pom_path" package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v6
        with:
          name: GodMace
          path: '**/target/godmace-1.0.0.jar'
          if-no-files-found: error
